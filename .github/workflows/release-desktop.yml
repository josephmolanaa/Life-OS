name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js & prepare desktop assets
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vvwmtfzatvwcedxqmxtk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d210ZnphdHZ3Y2VkeHFteHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1Njc2NzAsImV4cCI6MjA5NTE0MzY3MH0.KaBcN-VqOzoEUc5_HxgQ9U-qMhEAhBT0xeBJ9HxJWnM
        run: |
          npm run build
          npm run desktop:prepare


      - name: Build Electron installer
        run: npx electron-builder --win nsis --publish never

      - name: Validate update artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Run releases from a version tag matching package.json.'
          }
          foreach ($file in @("dist/Life OS Setup $version.exe", "dist/Life OS Setup $version.exe.blockmap", 'dist/latest.yml')) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing artifact: $file" }
          }

      - name: Preserve update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $release = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title $tag
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          } elseif (!(($release | ConvertFrom-Json).isDraft)) {
            throw 'Published releases are immutable; use a new version tag.'
          }
          gh release upload $tag "dist/Life OS Setup $version.exe" "dist/Life OS Setup $version.exe.blockmap" dist/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Artifact upload failed' }
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Asset verification failed' }
          foreach ($name in @("Life.OS.Setup.$version.exe", "Life.OS.Setup.$version.exe.blockmap", 'latest.yml')) {
            if ($name -notin $assets) { throw "Published asset missing: $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
